---
dependency:
  name: galaxy
  enabled: true
  options:
    role-file: molecule/shared/requirements.yml
    requirements-file: molecule/shared/collections.yml

driver:
  name: docker

lint: |
  ansible-lint

platforms:
  - name: rocky9
    image: rockylinux:9
    pre_build_image: true
    privileged: true
    override_command: false
    dns_servers:
      - 1.1.1.1
      - 8.8.8.8
    tmpfs:
      - /run
      - /run/lock
    capabilities:
      - SYS_ADMIN
    security_opts:
      - seccomp=unconfined

provisioner:
  name: ansible
  playbooks:
    converge: ../shared/converge.yml
    prepare: ../shared/prepare.yml
  env:
    ANSIBLE_REMOTE_TMP: /tmp/.ansible-tmp

verifier:
  name: ansible
